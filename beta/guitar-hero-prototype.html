<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototipo: Guitar Hero desde tablatura</title>
<style>
  :root {
    --bg-a: #05040c; --bg-b: #0c0a1f; --panel: rgba(20,18,40,0.55); --panel-line: rgba(150,170,255,0.18);
    --neon-cyan: #00e5ff; --good: #4dffb0; --miss: #ff3b6e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 1.25rem 1rem;
    background: radial-gradient(ellipse at 50% 0%, #14123a 0%, var(--bg-b) 45%, var(--bg-a) 100%);
    color: #e8ecff; font-family: 'Segoe UI', Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 {
    font-size: 1.15rem; font-weight: 800; letter-spacing: 0.04em; margin: 0.25rem 0 0.2rem;
    background: linear-gradient(90deg, #00e5ff, #c65cff, #ff3b6e);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { font-size: 0.78rem; color: #9ba3d0; margin-bottom: 0.85rem; text-align: center; max-width: 640px; line-height: 1.4; }
  .subtitle b { color: #00e5ff; font-weight: 700; }
  .hud {
    display: flex; gap: 1.5rem; align-items: center; margin-bottom: 0.7rem; font-size: 0.85rem;
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 999px;
    padding: 0.5rem 1.4rem; backdrop-filter: blur(10px);
  }
  .hud .score { font-size: 1.4rem; font-weight: 800; letter-spacing: 0.02em; text-shadow: 0 0 12px rgba(0,229,255,0.6); }
  .hud .combo { color: var(--good); font-weight: 700; text-shadow: 0 0 8px rgba(77,255,176,0.6); }
  #stage { position: relative; }
  canvas {
    background: #05040c; border-radius: 14px; display: block;
    border: 1px solid var(--panel-line);
    box-shadow: 0 0 40px rgba(0,229,255,0.12), 0 0 0 1px rgba(255,255,255,0.02) inset;
  }
  .controls {
    margin-top: 0.85rem; display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; align-items: center;
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px; padding: 0.6rem 0.9rem;
    backdrop-filter: blur(10px);
  }
  .speed-label { font-size: 0.78rem; color: #9ba3d0; margin-left: 0.4rem; }
  button {
    background: rgba(255,255,255,0.04); color: #e8ecff; border: 1px solid var(--panel-line); border-radius: 8px;
    padding: 0.5rem 1rem; font-size: 0.85rem; cursor: pointer; font-weight: 600; transition: all 0.15s;
  }
  button:hover { border-color: #00e5ff; box-shadow: 0 0 14px rgba(0,229,255,0.35); color: #00e5ff; }
  .keys-hint { display: flex; gap: 0.5rem; margin-top: 0.8rem; }
  .key-chip {
    width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.85rem; color: #05040c; border: 2px solid transparent;
  }
  .legend { display:flex; gap:1rem; margin-top:0.7rem; font-size:0.72rem; color:#9ba3d0; flex-wrap:wrap; justify-content:center; max-width:520px; }
  .legend span.dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:0.3rem; vertical-align:middle; box-shadow: 0 0 6px currentColor; }
</style>
</head>
<body>
<h1>🎸 Prototipo — Guitar Hero desde tablatura</h1>
<div class="subtitle">
  Prueba de viabilidad: comparación de 3 formas de decidir qué cuerda y traste
  mostrar en cada nota. Elige una variante abajo para comparar cómo se siente.
</div>

<div style="margin-bottom:0.9rem;">
  <select id="variantSelect" onchange="switchVariant(this.value)" style="background:rgba(255,255,255,0.05);color:#e8ecff;border:1px solid rgba(150,170,255,0.25);border-radius:8px;padding:0.5rem 0.8rem;font-size:0.85rem;">
    <option value="inferred" selected>MIDI + traste inferido (Sultans of Swing)</option>
    <option value="tab">Tablatura real (Te Quiero)</option>
    <option value="pitchband">MIDI por banda de altura (Sultans of Swing)</option>
  </select>
  <div id="variantLabel" style="font-size:0.72rem;color:#9ba3d0;margin-top:0.35rem;max-width:480px;">MIDI + traste inferido (Sultans of Swing) — ritmo exacto, dedos calculados</div>
</div>

<div class="hud">
  <div class="score" id="scoreEl">0</div>
  <div class="combo" id="comboEl"></div>
  <div id="statusEl" style="color:#9497ad;">Pulsa Empezar</div>
</div>

<div id="stage">
  <canvas id="cv" width="480" height="560"></canvas>
</div>

<div class="keys-hint" id="keysHint"></div>

<div class="legend" id="legend"></div>

<div class="controls">
  <button onclick="startGame()">▶ Empezar</button>
  <button onclick="testBeep()">🔔 Probar sonido (pitido simple)</button>
  <button onclick="restartGame()">↺ Reiniciar</button>
  <button onclick="toggleMetronome()" id="metroBtn">🔊 Metrónomo: ON</button>
  <button onclick="toggleMusic()" id="musicBtn">🎵 Música: ON</button>
  <label style="display:inline-flex;align-items:center;gap:0.3rem;font-size:0.82rem;"><input type="checkbox" id="trackComp" checked onchange="updateTrackEnabled()">🎸 Guitarra</label>
  <label style="display:inline-flex;align-items:center;gap:0.3rem;font-size:0.82rem;"><input type="checkbox" id="trackBass" checked onchange="updateTrackEnabled()">🎵 Bajo</label>
  <label style="display:inline-flex;align-items:center;gap:0.3rem;font-size:0.82rem;"><input type="checkbox" id="trackDrums" checked onchange="updateTrackEnabled()">🥁 Batería</label>
  <button onclick="adjustSpeed(0.4)">🐢 Más lento</button>
  <button onclick="adjustSpeed(-0.4)">🐇 Más rápido</button>
  <span class="speed-label" id="speedLabel"></span>
</div>

const VARIANTS = {
  tab: { chart: CHART_TAB, music: [], bpm: 104, label: 'Tablatura real (Te Quiero) — cuerda/traste correctos, ritmo aproximado' },
  inferred: { chart: CHART_INFERRED, music: MUSIC_TRACKS, bpm: 120, label: 'MIDI + traste inferido (Sultans of Swing) — ritmo exacto, dedos calculados' },
  pitchband: { chart: CHART_PITCHBAND, music: MUSIC_TRACKS, bpm: 120, label: 'MIDI por banda de altura (Sultans of Swing) — sin cuerda/traste real' }
};

// Orden visual de carriles (grave -> agudo, como en un mástil real)
const LANES = ['E', 'A', 'D', 'G', 'B', 'e'];
const LANE_COLOR = { E: '#c65cff', A: '#00e5ff', D: '#00ffa2', G: '#fff45e', B: '#ff9d3d', e: '#ff3b6e' };
const KEYS = ['a', 's', 'd', 'f', 'g', 'h']; // una tecla por carril, mismo orden que LANES

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const LANE_W = W / LANES.length;
const HIT_Y = H - 70;
let NOTE_TRAVEL_SEC = 3.2; // cuánto tarda una nota en caer desde arriba hasta la línea (más alto = más lento/fácil de leer)
const HIT_WINDOW = 0.15; // ±150ms
const STRING_THICKNESS = { E: 3, A: 2.6, D: 2.2, G: 1.8, B: 1.4, e: 1.1 }; // grave -> agudo, como cuerdas reales

// ── Carretera con perspectiva (converge hacia un punto de fuga arriba) ─────
const TOP_SCALE = 0.4; // ancho relativo de la carretera en el punto más lejano
function depthAt(y) { return Math.max(0, Math.min(1.15, y / HIT_Y)); } // 0=lejos, 1=línea de impacto
function highwayWidthAt(k) { return W * (TOP_SCALE + (1 - TOP_SCALE) * k); }
function highwayLeftAt(k) { return (W - highwayWidthAt(k)) / 2; }
function laneWidthAt(k) { return highwayWidthAt(k) / LANES.length; }
function laneCenterXAt(i, k) { return highwayLeftAt(k) + (i + 0.5) * laneWidthAt(k); }

// ── Partículas al acertar una nota ──────────────────────────────────────────
let particles = []; // {x,y,vx,vy,life,color}
function spawnHitParticles(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 40 + Math.random() * 90;
    particles.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life: 1, color });
  }
}
function updateParticles(dt) {
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.6;
  }
  particles = particles.filter(p => p.life > 0);
}
function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3 * p.life + 1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

let audioCtx = null;
let startCtxTime = 0;

let metronomeOn = true;
let musicOn = true;
let musicGain = null;
let trackEnabled = { comp: true, bass: true, drums: true };
let scheduledVoices = [];
let trackPointers = [];
let musicSchedulerTimer = null;
const MUSIC_LOOKAHEAD_SEC = 2.5;
const MUSIC_SCHEDULE_INTERVAL_MS = 200;
let sharedNoiseBuffer = null;

function startGame() {
  if (running) return;
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (!musicGain) {
    musicGain = audioCtx.createGain();
    musicGain.gain.value = musicOn ? 0.8 : 0;
    const compressor = audioCtx.createDynamicsCompressor();
    compressor.threshold.value = -28;
    compressor.knee.value = 18;
    compressor.ratio.value = 14;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.18;
    musicGain.connect(compressor);
    compressor.connect(audioCtx.destination);
  }
  stopAllMusic();
  resetState();
  running = true;
  startCtxTime = audioCtx.currentTime + 0.3;
  lastBeatScheduled = -1;
  lastFrameMs = null;
  particles = [];
  startMusicScheduler();
  document.getElementById('statusEl').textContent = 'Tocando…';
  requestAnimationFrame(loop);
}

function restartGame() { running = false; startGame(); }

function switchVariant(key) {
  running = false;
  stopAllMusic();
  currentVariantKey = key;
  const v = VARIANTS[key];
  CHART = v.chart;
  activeMusicTracks = v.music;
  SEC_PER_BEAT = 60 / v.bpm;
  document.getElementById('variantLabel').textContent = v.label;
  resetState();
  draw(-NOTE_TRAVEL_SEC);
}

function testBeep() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.value = 880;
  g.gain.setValueAtTime(0.4, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
  o.connect(g).connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime + 0.55);

}

}

function midiToFreq(pitch) { return 440 * Math.pow(2, (pitch - 69) / 12); }

function getNoiseBuffer() {
  if (sharedNoiseBuffer) return sharedNoiseBuffer;
  const len = Math.floor(audioCtx.sampleRate * 0.3);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  sharedNoiseBuffer = buf;
  return buf;
}

function playSynthNote(startTime, durSec, pitch, type) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type === 'bass' ? 'triangle' : 'sawtooth';
  osc.frequency.value = midiToFreq(pitch);
  const peak = type === 'bass' ? 0.28 : 0.09;
  const attack = 0.008;
  const release = Math.min(0.2, Math.max(0.03, durSec * 0.5));
  const sustainEnd = Math.max(startTime + attack + 0.01, startTime + durSec - release);
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(peak, startTime + attack);
  gain.gain.setValueAtTime(peak, sustainEnd);
  gain.gain.linearRampToValueAtTime(0.0001, sustainEnd + release);
  osc.connect(gain).connect(musicGain);
  osc.start(startTime);
  osc.stop(sustainEnd + release + 0.02);
  scheduledVoices.push(osc);
}

function playDrumHit(startTime, pitch) {
  const isKick = pitch === 35 || pitch === 36;
  const isHihat = pitch === 42 || pitch === 44 || pitch === 46 || pitch === 51 || pitch === 59;
  if (isKick) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, startTime);
    osc.frequency.exponentialRampToValueAtTime(42, startTime + 0.11);
    gain.gain.setValueAtTime(0.7, startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.17);
    osc.connect(gain).connect(musicGain);
    osc.start(startTime); osc.stop(startTime + 0.19);
    scheduledVoices.push(osc);
    return;
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = getNoiseBuffer();
  const filter = audioCtx.createBiquadFilter();
  filter.type = isHihat ? 'highpass' : 'bandpass';
  filter.frequency.value = isHihat ? 7500 : 1700;
  const gain = audioCtx.createGain();
  const dur = isHihat ? 0.05 : 0.14;
  gain.gain.setValueAtTime(isHihat ? 0.15 : 0.3, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + dur);
  noise.connect(filter).connect(gain).connect(musicGain);
  noise.start(startTime); noise.stop(startTime + dur + 0.02);
  scheduledVoices.push(noise);
}

function scheduleMusicWindow() {
  const nowSongTime = audioCtx.currentTime - startCtxTime;
  const horizon = nowSongTime + MUSIC_LOOKAHEAD_SEC;
  activeMusicTracks.forEach((track, ti) => {
    let idx = trackPointers[ti] || 0;
    while (idx < track.notes.length && track.notes[idx][0] <= horizon) {
      const [startSec, durSec, pitch] = track.notes[idx];
      if (trackEnabled[track.type]) {
        const at = startCtxTime + startSec;
        if (track.type === 'drums') playDrumHit(at, pitch);
        else playSynthNote(at, durSec, pitch, track.type);
      }
      idx++;
    }
    trackPointers[ti] = idx;
  });
}

function startMusicScheduler() {
  trackPointers = activeMusicTracks.map(() => 0);
  scheduleMusicWindow();
  if (musicSchedulerTimer) clearInterval(musicSchedulerTimer);
  musicSchedulerTimer = setInterval(scheduleMusicWindow, MUSIC_SCHEDULE_INTERVAL_MS);
}

function stopMusicScheduler() {
  if (musicSchedulerTimer) { clearInterval(musicSchedulerTimer); musicSchedulerTimer = null; }
}

function stopAllMusic() {
  stopMusicScheduler();
  for (const v of scheduledVoices) { try { v.stop(0); } catch (e) {} }
  scheduledVoices = [];
}

function playClick(strong) {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.frequency.value = strong ? 1400 : 900;
  g.gain.value = 0.15;
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
  o.connect(g).connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime + 0.06);
}

function scheduleMetronome(songTime) {
  if (!metronomeOn) return;
  const beatIdx = Math.floor(songTime / SEC_PER_BEAT);
  if (beatIdx > lastBeatScheduled && beatIdx >= 0) {
    lastBeatScheduled = beatIdx;
    playClick(beatIdx % 4 === 0);
  }
}

function judge(laneIdx) {
  const string = LANES[laneIdx];
  const songTime = audioCtx.currentTime - startCtxTime;
  let best = null, bestDiff = Infinity;
  for (const n of notes) {
    if (n.hit || n.missed || n.ev.string !== string) continue;
    const diff = Math.abs(n.ev.timeSec - songTime);
    if (diff < bestDiff) { bestDiff = diff; best = n; }
  }
  if (best && bestDiff <= HIT_WINDOW) {
    best.hit = true;
    combo++; maxCombo = Math.max(maxCombo, combo);
    score += Math.round(100 * (1 - bestDiff / HIT_WINDOW)) + combo;
    spawnHitParticles(laneCenterXAt(laneIdx, 1), HIT_Y, LANE_COLOR[string]);
  } else {
    combo = 0;
  }
  document.getElementById('scoreEl').textContent = score;
  document.getElementById('comboEl').textContent = combo > 1 ? combo + 'x combo' : '';
}

window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const idx = KEYS.indexOf(e.key.toLowerCase());
  if (idx === -1 || !running) return;
  flashLane(idx);
  judge(idx);
});

let laneFlash = LANES.map(() => 0);
function flashLane(i) { laneFlash[i] = 1; }

function timeToY(dt) {
  return HIT_Y - (dt / NOTE_TRAVEL_SEC) * HIT_Y;
}

const STARS = Array.from({ length: 60 }, () => ({
  x: Math.random() * W, y: Math.random() * (H - 90), r: Math.random() * 1.3 + 0.3, phase: Math.random() * Math.PI * 2
}));

function draw(songTime) {
  ctx.clearRect(0, 0, W, H);

  // Fondo: espacio profundo con resplandor hacia el punto de fuga
  const sky = ctx.createLinearGradient(0, 0, 0, HIT_Y);
  sky.addColorStop(0, '#0a0820');
  sky.addColorStop(1, '#05040c');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  const glow = ctx.createRadialGradient(W / 2, 0, 0, W / 2, 0, W * 0.6);
  glow.addColorStop(0, 'rgba(0,229,255,0.10)');
  glow.addColorStop(1, 'rgba(0,229,255,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, HIT_Y);

  for (const s of STARS) {
    const tw = 0.5 + 0.5 * Math.sin(songTime * 2 + s.phase);
    ctx.fillStyle = `rgba(200,220,255,${0.15 + 0.35 * tw})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }

  // Bordes de la carretera (convergen hacia el punto de fuga arriba)
  ctx.strokeStyle = 'rgba(0,229,255,0.5)';
  ctx.lineWidth = 1.5;
  ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(highwayLeftAt(0), 0); ctx.lineTo(highwayLeftAt(1.15), H);
  ctx.moveTo(highwayLeftAt(0) + highwayWidthAt(0), 0); ctx.lineTo(highwayLeftAt(1.15) + highwayWidthAt(1.15), H);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Trastes: líneas horizontales que caen a la misma velocidad que las notas,
  // uno por tiempo (beat), más marcado cada compás (4 tiempos), con el ancho
  // de la carretera en esa profundidad (efecto de perspectiva).
  const firstBeat = Math.floor((songTime - 0.5) / SEC_PER_BEAT);
  const lastBeat = Math.ceil((songTime + NOTE_TRAVEL_SEC) / SEC_PER_BEAT);
  for (let b = Math.max(0, firstBeat); b <= lastBeat; b++) {
    const dt = b * SEC_PER_BEAT - songTime;
    const y = timeToY(dt);
    if (y < -10 || y > H + 10) continue;
    const k = depthAt(y);
    const left = highwayLeftAt(k), right = left + highwayWidthAt(k);
    const isMeasure = b % 4 === 0;
    ctx.strokeStyle = isMeasure ? 'rgba(198,92,255,0.65)' : 'rgba(150,170,255,0.22)';
    ctx.lineWidth = isMeasure ? 2 : 1;
    if (isMeasure) { ctx.shadowColor = '#c65cff'; ctx.shadowBlur = 10; }
    ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // "Cuerdas": línea de cada carril con grosor según cuerda real, siguiendo la perspectiva
  for (let i = 0; i < LANES.length; i++) {
    const color = LANE_COLOR[LANES[i]];
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.45;
    ctx.lineWidth = STRING_THICKNESS[LANES[i]];
    ctx.shadowColor = color; ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(laneCenterXAt(i, 0), 0);
    ctx.lineTo(laneCenterXAt(i, 1.15), H);
    ctx.stroke();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  // Resplandor al pulsar una tecla (columna de luz en su color)
  for (let i = 0; i < LANES.length; i++) {
    if (laneFlash[i] <= 0) continue;
    const color = LANE_COLOR[LANES[i]];
    ctx.save();
    ctx.globalAlpha = 0.25 * laneFlash[i];
    ctx.fillStyle = color;
    const left = laneCenterXAt(i, 0) - laneWidthAt(0) / 2;
    ctx.beginPath();
    ctx.moveTo(laneCenterXAt(i, 0) - laneWidthAt(0) / 2, 0);
    ctx.lineTo(laneCenterXAt(i, 0) + laneWidthAt(0) / 2, 0);
    ctx.lineTo(laneCenterXAt(i, 1) + laneWidthAt(1) / 2, H);
    ctx.lineTo(laneCenterXAt(i, 1) - laneWidthAt(1) / 2, H);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    laneFlash[i] *= 0.85;
    if (laneFlash[i] < 0.02) laneFlash[i] = 0;
  }

  // Nombre de cada cuerda, fijo arriba del todo
  for (let i = 0; i < LANES.length; i++) {
    const x = laneCenterXAt(i, 0);
    const color = LANE_COLOR[LANES[i]];
    ctx.fillStyle = color;
    ctx.shadowColor = color; ctx.shadowBlur = 8;
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(LANES[i], x, 8);
    ctx.shadowBlur = 0;
  }

  // Línea de impacto
  ctx.strokeStyle = '#e8ecff';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.moveTo(highwayLeftAt(1), HIT_Y); ctx.lineTo(highwayLeftAt(1) + highwayWidthAt(1), HIT_Y); ctx.stroke();
  ctx.shadowBlur = 0;

  // Notas: rombos brillantes que escalan con la profundidad (más grandes cerca)
  for (const n of notes) {
    const laneIdx = LANES.indexOf(n.ev.string);
    if (laneIdx === -1) continue;
    const dt = n.ev.timeSec - songTime;
    const y = timeToY(dt);
    if (y < -30 || y > H + 30) { if (dt < -HIT_WINDOW && !n.hit && !n.missed) n.missed = true; continue; }
    if (dt < -HIT_WINDOW && !n.hit && !n.missed) { n.missed = true; combo = 0; document.getElementById('comboEl').textContent = ''; }
    const k = depthAt(y);
    const x = laneCenterXAt(laneIdx, k);
    const size = 10 + 10 * k; // más grande cerca de la línea de impacto
    const color = LANE_COLOR[n.ev.string];

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.PI / 4);
    ctx.globalAlpha = n.hit ? 0.3 : (n.missed ? 0.25 : 1);
    ctx.fillStyle = n.hit ? '#4dffb0' : (n.missed ? '#3a2a44' : color);
    if (!n.hit && !n.missed) { ctx.shadowColor = color; ctx.shadowBlur = 14; }
    ctx.fillRect(-size / 2, -size / 2, size, size);
    if (n.ev.approx && !n.hit && !n.missed) {
      ctx.setLineDash([4, 3]);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffffcc';
      ctx.shadowBlur = 0;
      ctx.strokeRect(-size / 2, -size / 2, size, size);
      ctx.setLineDash([]);
    }
    ctx.restore();

    if (!n.hit && !n.missed) {
      ctx.fillStyle = '#05040c';
      ctx.font = `bold ${10 + 3 * k}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(n.ev.fret), x, y);
    }
  }

  drawParticles();
}

let lastFrameMs = null;
function loop(nowMs) {
  if (!running) return;
  const frameDt = lastFrameMs != null ? (nowMs - lastFrameMs) / 1000 : 0;
  lastFrameMs = nowMs;
  const songTime = audioCtx.currentTime - startCtxTime;
  scheduleMetronome(songTime);
  updateParticles(frameDt);
  draw(songTime);
  if (songTime > CHART.durationSec + NOTE_TRAVEL_SEC) {
    running = false;
    stopMusicScheduler();
    document.getElementById('statusEl').textContent =
      `Terminado — puntuación ${score}, combo máximo ${maxCombo}`;
    return;
  }
  requestAnimationFrame(loop);
}

draw(-NOTE_TRAVEL_SEC);
</script>
</body>
</html>
